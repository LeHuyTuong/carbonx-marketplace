apiVersion: v1
kind: Service
metadata:
  name: api-gateway-lb
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
spec:
  type: ClusterIP
  selector:
    app: discovery-server
  ports:
    - port: 8761
      targetPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: web-bff
spec:
  type: ClusterIP
  selector:
    app: web-bff
  ports:
    - port: 8091
      targetPort: 8091
---
apiVersion: v1
kind: Service
metadata:
  name: mobile-bff
spec:
  type: ClusterIP
  selector:
    app: mobile-bff
  ports:
    - port: 8092
      targetPort: 8092
