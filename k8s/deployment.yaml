apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: gcr.io/carbonx-project/api-gateway:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: carbonx-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading-service
  template:
    metadata:
      labels:
        app: trading-service
    spec:
      containers:
        - name: trading-service
          image: gcr.io/carbonx-project/trading-service:1.0.0
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: carbonx-config
            - secretRef:
                name: carbonx-secrets
