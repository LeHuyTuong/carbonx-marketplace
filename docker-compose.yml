services:
  mysql:
    image: mysql:8.0
    container_name: carbonx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./monitoring/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: carbonx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    container_name: carbonx-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  discovery-server:
    build: { context: ./backend, dockerfile: discovery-server/Dockerfile }
    container_name: carbonx-eureka
    ports: ["8761:8761"]

  config-server:
    build: { context: ./backend, dockerfile: config-server/Dockerfile }
    container_name: carbonx-config
    depends_on: [discovery-server, kafka]
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_REPO_PATH: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    ports: ["8888:8888"]

  api-gateway:
    build: { context: ./backend, dockerfile: api-gateway/Dockerfile }
    container_name: carbonx-gateway
    depends_on: [discovery-server, config-server]
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports: ["8080:8080"]

  identity-service:
    build: { context: ./backend, dockerfile: identity-service/Dockerfile }
    depends_on: { mysql: { condition: service_healthy }, discovery-server: { condition: service_started } }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/carbonx_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8081:8081"]

  mrv-service:
    build: { context: ./backend, dockerfile: mrv-service/Dockerfile }
    depends_on: { mysql: { condition: service_healthy }, discovery-server: { condition: service_started } }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/carbonx_mrv?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8082:8082"]

  registry-service:
    build: { context: ./backend, dockerfile: registry-service/Dockerfile }
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/carbonx_registry?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8083:8083"]

  trading-service:
    build: { context: ./backend, dockerfile: trading-service/Dockerfile }
    depends_on: { mysql: { condition: service_healthy }, discovery-server: { condition: service_started } }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/carbonx_trading?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8084:8084"]

  ledger-service:
    build: { context: ./backend, dockerfile: ledger-service/Dockerfile }
    depends_on: { mysql: { condition: service_healthy }, discovery-server: { condition: service_started } }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/carbonx_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8085:8085"]

  notification-service:
    build: { context: ./backend, dockerfile: notification-service/Dockerfile }
    depends_on: { mysql: { condition: service_healthy }, kafka: { condition: service_started } }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/carbonx_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8086:8086"]

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    container_name: carbonx-frontend
    depends_on: [api-gateway]
    ports: ["3000:80"]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: carbonx-jaeger
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: carbonx-prometheus
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: carbonx-grafana
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports: ["3001:3000"]

volumes:
  mysql_data:
  grafana_data:
